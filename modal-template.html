<div class="nakupna-brzda-overlay">
  <div
    class="nakupna-brzda-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="nakupna-brzda-title">
    <h2 id="nakupna-brzda-title" class="nakupna-brzda-title">
      Zastav sa na chvilu
    </h2>
    <p class="nakupna-brzda-copy">
      Pred pokracovanim si prejdi par kratkych otazok.
    </p>
    <ul class="nakupna-brzda-list" data-role="questions"></ul>
    <div class="nakupna-brzda-actions">
      <button
        type="button"
        class="nakupna-brzda-button nakupna-brzda-button-primary"
        data-action="cancel">
        Nepotrebujem to
      </button>
      <button
        type="button"
        class="nakupna-brzda-button nakupna-brzda-button-secondary"
        data-action="continue">
        Pokracovat do košíka
      </button>
    </div>
  </div>
</div>
